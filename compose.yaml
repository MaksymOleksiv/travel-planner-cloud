# Local run: app + PostgreSQL with one command
#   cp .env.example .env   (set your own password)
#   docker compose up --build
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_planner}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    # no "ports": the database is reachable only inside the compose network

  app:
    build: .
    environment:
      DB_HOST: db            # service name = hostname in the compose network
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-travel_planner}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ARTIC_API_ENABLED: ${ARTIC_API_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections

volumes:
  pgdata:
